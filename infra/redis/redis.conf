# Privex Redis config - in-memory only, no disk persistence.
# save ""        → no RDB snapshots
# appendonly no  → no AOF
# Nothing user-related ever touches disk.

save ""
appendonly no

# Bounded, and NEVER evicts. Redis holds security state - spent PoW tickets, used
# login challenges, rate-limit counters. Under LRU a memory squeeze would quietly
# forget them (a replayed ticket or reset limit would pass). With noeviction a
# full Redis makes writes fail instead, and the server refuses requests (fails
# closed) until memory frees up as keys expire.
maxmemory 256mb
maxmemory-policy noeviction

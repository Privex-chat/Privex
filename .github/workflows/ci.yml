# CI: the same checks run locally before every PR - crypto-wasm unit tests,
# server unit + integration tests (real Postgres + Redis), and the web app's
# typecheck, vitest suite and production build. Read-only token; no secrets.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  crypto-wasm:
    name: crypto-wasm (Rust unit tests)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/crypto-wasm
      - run: cargo test --locked
        working-directory: packages/crypto-wasm

  server:
    name: server (unit + integration)
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: privex
          POSTGRES_PASSWORD: privex
          POSTGRES_DB: privex
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U privex"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7.2-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # Compile the sqlx macros against the committed server/.sqlx cache.
      SQLX_OFFLINE: "true"
      DATABASE_URL: postgres://privex:privex@127.0.0.1:5432/privex
      REDIS_URL: redis://127.0.0.1:6379
    steps:
      - uses: actions/checkout@v4
      # server/build.rs generates the Protobuf types with prost, which needs protoc.
      - run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server
      - run: cargo test --locked
        working-directory: server

  web:
    name: web (typecheck + vitest + build)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/crypto-wasm
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The web tests run against the real WASM and the generated Protobuf code;
      # neither is committed, so build both first.
      - run: pnpm --filter @privex/crypto-wasm build
      - run: pnpm --filter @privex/protocol build
      - run: pnpm --filter @privex/crypto-wasm test
      - run: pnpm --filter @privex/protocol test
      - run: pnpm --filter @privex/web typecheck
      - run: pnpm --filter @privex/web test
      - run: pnpm --filter @privex/web build
